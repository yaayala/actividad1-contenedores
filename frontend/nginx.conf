server {
    listen 80;
    server_name localhost;

    # Permite subir imágenes de hasta 10 MB (por defecto Nginx limita a 1 MB)
    client_max_body_size 10m;

    # DNS interno de Docker; resuelve "backend" en cada petición aunque arranque después
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5000;

    # Archivos estáticos de la app React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reenvía la API al contenedor del backend
    location /api/ {
        proxy_pass $backend;
    }

    # Reenvía las imágenes subidas al contenedor del backend
    location /uploads/ {
        proxy_pass $backend;
    }
}
